[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "granny"
version = "1.0a1"
description = "GRANNY is a software package used to rate disorder severity in pome fruits."
authors = [
    { name = "Nhan H. Nguyen" },
    { name = "Heidi Hargarten" },
    { name = "Loren Honaas" },
    { name = "Stephen P. Ficklin" },
]
license = { text = "GNU General Public License v3.0" }
requires-python = ">=3.9"
urls = { homepage = "https://github.com/SystemsGenetics/granny" }
dependencies = [
    "ultralytics>=8.0,<9.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
]

[project.scripts]
granny = "Granny.GrannyBase:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["Granny"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
